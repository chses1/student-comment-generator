<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="班級導師評語生成系統，可整理學生特質並產生不同版本的導師評語。"
    />
    <title>班級導師評語生成系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" crossorigin src="./assets/index-BMINSr3K.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/react-CoqjRzmd.js">
    <link rel="modulepreload" crossorigin href="./assets/firebase-D7qmgChP.js">
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fdf2f8;color:#9d174d;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-weight:700;">
        班級導師評語生成系統載入中...
      </div>
    </div>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root');
        if (!root) return;
        root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff1f2;color:#be123c;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;padding:24px;text-align:center;"><div><h1 style="font-size:22px;margin-bottom:12px;">頁面載入時發生錯誤</h1><p style="font-size:14px;">' + String(event.message || '未知錯誤') + '</p></div></div>';
      });
    </script>
  </body>
</html>
